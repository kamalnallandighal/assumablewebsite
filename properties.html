<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Property Search — Luxury Division</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;1,8..60,400;1,8..60,600&display=swap" rel="stylesheet">
    <style>
      /* ── Design tokens (Assumable redesign) ── */
      :root {
        --a-ink:        #0F1623;
        --a-ink-2:      #1B2236;
        --a-navy:       #2B4072;
        --a-cream:      #F4F3F2;
        --a-paper:      #FFFFFF;
        --a-line:       #E5E3E1;
        --a-line-2:     #D4D1CE;
        --a-muted:      #868686;
        --a-muted-2:    #5E5E5E;
        --a-terra:      #D35932;
        --a-terra-soft: #FDD8CC;
        --a-terra-ink:  #631800;
        --a-ok:         #1E6F5C;
        --a-r-pill:     999px;
        --a-sans:       'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        --a-serif:      'Source Serif 4', Georgia, serif;
        /* legacy compat for styles.css */
        --dark: #0F1623;
        --forest: #1E6F5C;
        --cream: #F4F3F2;
        --border: #E5E3E1;
        --text: #0F1623;
        --serif: 'Source Serif 4', Georgia, serif;
        --sans: 'Inter', -apple-system, sans-serif;
      }

      /* ── Nav ── */
      .a-nav {
        display: flex; align-items: center; justify-content: space-between;
        padding: 0 40px; height: 68px;
        background: rgba(255,255,255,.92);
        backdrop-filter: saturate(1.2) blur(10px);
        -webkit-backdrop-filter: saturate(1.2) blur(10px);
        border-bottom: 1px solid var(--a-line);
        position: sticky; top: 0; z-index: 200;
        font-family: var(--a-sans);
      }
      .a-nav-logo {
        font-weight: 700; font-size: 15px; letter-spacing: -.01em;
        color: var(--a-ink); display: inline-flex; align-items: center; gap: 10px;
        text-decoration: none;
      }
      .a-nav-dot { width: 10px; height: 10px; background: var(--a-ink); border-radius: 2px; flex-shrink: 0; }
      .a-nav-links { display: flex; gap: 28px; position: absolute; left: 50%; transform: translateX(-50%); }
      .a-nav-links a { font-size: 14px; font-weight: 500; color: var(--a-muted-2); text-decoration: none; transition: color .15s; }
      .a-nav-links a:hover, .a-nav-links a.active { color: var(--a-ink); }
      .a-nav-actions { display: flex; gap: 10px; align-items: center; }
      .a-btn {
        display: inline-flex; align-items: center; justify-content: center; gap: 8px;
        font-family: var(--a-sans); font-weight: 500; font-size: 14px;
        padding: 12px 20px; border-radius: var(--a-r-pill); border: 1px solid transparent;
        cursor: pointer; transition: background .15s, color .15s, border-color .15s;
        white-space: nowrap; text-decoration: none;
      }
      .a-btn-sm { padding: 8px 14px; font-size: 13px; }
      .a-btn-primary { background: var(--a-ink); color: #fff; }
      .a-btn-primary:hover { background: var(--a-ink-2); }
      .a-btn-ghost { background: transparent; color: var(--a-ink); border-color: var(--a-line-2); }
      .a-btn-ghost:hover { border-color: var(--a-ink); }

      /* ── Filter bar ── */
      .filter-bar {
        background: #fff; border-bottom: 1px solid var(--a-line);
        padding: 14px 32px; display: flex; align-items: center;
        justify-content: space-between; gap: 12px; flex-shrink: 0;
        font-family: var(--a-sans); width: 100%;
      }
      .filter-chips { display: flex; align-items: center; gap: 10px; flex-wrap: nowrap; }
      .filter-chip {
        display: inline-flex; align-items: center; gap: 7px;
        padding: 9px 16px; font-size: 13px; font-weight: 500; cursor: pointer;
        border: 1px solid var(--a-line-2); border-radius: var(--a-r-pill);
        background: #fff; color: var(--a-ink); white-space: nowrap;
        position: relative; user-select: none; transition: border-color .15s;
      }
      .filter-chip:hover { border-color: var(--a-ink); }
      .filter-chip-active { background: var(--a-ink); color: #fff; border-color: var(--a-ink); }
      /* Location dropdown */
      .filter-dropdown-location { min-width: 320px; padding: 0; overflow: hidden; }
      .dd-location-search {
        display: flex; align-items: center; gap: 10px;
        padding: 14px 16px; border-bottom: 1px solid var(--a-line);
      }
      .dd-location-search input {
        border: none; outline: none; font-size: 14px; font-family: var(--a-sans);
        color: var(--a-ink); background: transparent; flex: 1;
      }
      .dd-location-search input::placeholder { color: var(--a-muted); }
      .dd-location-search svg { flex-shrink: 0; color: var(--a-muted); }
      .dd-location-body { padding: 8px 0; max-height: 320px; overflow-y: auto; }
      .dd-location-heading {
        font-size: 11px; font-weight: 700; letter-spacing: .08em;
        color: var(--a-muted); padding: 8px 16px 6px;
      }
      .dd-city-item {
        display: flex; align-items: center; gap: 10px;
        padding: 11px 16px; font-size: 14px; font-weight: 500; cursor: pointer;
        color: var(--a-ink); transition: background .1s;
      }
      .dd-city-item:hover { background: var(--a-cream); }
      .dd-city-item.active { color: var(--a-navy); font-weight: 600; }
      .dd-city-item svg { flex-shrink: 0; color: var(--a-muted); }
      .assumable-toggle { cursor: pointer; }
      .toggle-dot {
        width: 8px; height: 8px; border-radius: 50%;
        background: var(--a-ok); display: inline-block; flex-shrink: 0;
      }
      .filter-bar-right { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
      .count { font-size: 13px; font-weight: 500; color: var(--a-muted-2); }

      /* Filter dropdowns */
      .filter-dropdown {
        position: absolute; top: calc(100% + 8px); left: 0;
        background: #fff; border: 1px solid var(--a-line);
        border-radius: 14px; padding: 16px; min-width: 200px;
        box-shadow: 0 8px 24px rgba(15,22,35,.12);
        z-index: 500; display: none;
        font-family: var(--a-sans);
      }
      .filter-chip:focus-within .filter-dropdown,
      .filter-chip.dd-open .filter-dropdown { display: block; }
      .dd-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 10px; font-size: 13px; }
      .dd-row:last-child { margin-bottom: 0; }
      .dd-input, .dd-select {
        border: 1px solid var(--a-line-2); border-radius: 8px;
        padding: 8px 10px; font-size: 13px; font-family: var(--a-sans);
        outline: none; width: 130px;
      }
      .dd-input:focus, .dd-select:focus { border-color: var(--a-ink); }

      /* Loan type radio options */
      .dd-loan-opts { display: flex; flex-direction: column; gap: 4px; }
      .dd-loan-opt {
        display: flex; align-items: center; gap: 10px;
        padding: 9px 12px; border-radius: 8px; cursor: pointer;
        font-size: 13px; font-weight: 500; color: var(--a-ink);
        transition: background .12s;
      }
      .dd-loan-opt:hover { background: var(--a-cream); }
      .dd-loan-opt input[type="radio"] { accent-color: var(--a-ink); width: 15px; height: 15px; cursor: pointer; }

      /* Beds & baths dropdown */
      .filter-dropdown-bb { min-width: 340px; padding: 0; }
      .dd-bb-section { padding: 20px 20px 4px; }
      .dd-bb-label { font-size: 13px; font-weight: 600; color: var(--a-ink); margin-bottom: 12px; }
      .dd-bb-row { display: flex; border: 1px solid var(--a-line-2); border-radius: 10px; overflow: hidden; }
      .dd-bb-btn {
        flex: 1; padding: 10px 4px; font-size: 13px; font-weight: 500;
        background: #fff; color: var(--a-ink); border: none; border-right: 1px solid var(--a-line-2);
        cursor: pointer; transition: background .1s; white-space: nowrap;
      }
      .dd-bb-btn:last-child { border-right: none; }
      .dd-bb-btn:hover { background: var(--a-cream); }
      .dd-bb-btn.active { background: var(--a-ink); color: #fff; }
      .dd-bb-apply { padding: 16px 20px; border-top: 1px solid var(--a-line); margin-top: 16px; }
      .dd-bb-apply-btn {
        width: 100%; padding: 12px; border-radius: 8px; font-size: 14px; font-weight: 600;
        background: var(--a-ink); color: #fff; border: none; cursor: pointer;
        transition: opacity .15s;
      }
      .dd-bb-apply-btn:hover { opacity: .88; }

      /* ──────────── RESPONSIVE ──────────── */
      @media (max-width: 768px) {
        /* Nav */
        .a-nav { padding: 0 16px; height: 56px; }
        .a-nav-links { display: none; }
        .a-nav-actions .a-btn-ghost { display: none; }

        /* Filter bar — horizontal scroll the chips */
        .filter-bar { padding: 10px 12px; gap: 8px; }
        .filter-chips {
          overflow-x: auto;
          -webkit-overflow-scrolling: touch;
          scrollbar-width: none;
          flex-wrap: nowrap;
          max-width: 100%;
        }
        .filter-chips::-webkit-scrollbar { display: none; }
        .filter-chip { flex-shrink: 0; }
        .filter-bar-right { display: none; }

        /* Filter dropdowns — fit viewport */
        .filter-dropdown {
          left: 0; right: auto;
          max-width: calc(100vw - 24px);
        }
        .filter-dropdown-location,
        .filter-dropdown-bb { min-width: min(320px, calc(100vw - 24px)); }
      }
    </style>
  </head>
  <body>

  <!-- NAV -->
  <nav class="a-nav">
    <a href="index.html" class="a-nav-logo">
      <span class="a-nav-dot"></span>
      Assumable
    </a>
    <div class="a-nav-links">
      <a href="properties.html" class="active">Property search</a>
      <a href="index.html#how">How it works</a>
      <a href="index.html#off-market">Off-market</a>
      <a href="index.html#agent">Agent</a>
    </div>
    <div class="a-nav-actions">
      <button class="a-btn a-btn-ghost a-btn-sm">Sign in</button>
      <a href="index.html#funnel-card" class="a-btn a-btn-primary a-btn-sm">Find your home</a>
    </div>
  </nav>

    <section class="map-area page-container">
      <!-- FILTER BAR — full width, above map+cards -->
      <header class="filter-bar">
        <div class="filter-chips">
          <div class="filter-chip" id="chip-location">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4l-6 2v14l6-2 6 2 6-2V4l-6 2-6-2zM9 4v14M15 6v14"/></svg>
            <span id="chip-location-label">Location</span>
            <div class="filter-dropdown filter-dropdown-location" id="dd-location">
              <div class="dd-location-search">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
                <input type="text" id="location-input" placeholder="Enter a city or zip code" autocomplete="off"/>
              </div>
              <div class="dd-location-body">
                <div class="dd-location-heading">CITIES</div>
                <div id="dd-city-list"></div>
              </div>
            </div>
          </div>
          <div class="filter-chip" id="chip-loan">
            <span id="chip-loan-label">Loan type</span>
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
            <div class="filter-dropdown" id="dd-loan">
              <div class="dd-loan-opts">
                <label class="dd-loan-opt"><input type="radio" name="loanType" value=""> All types</label>
                <label class="dd-loan-opt"><input type="radio" name="loanType" value="VA"> VA only</label>
                <label class="dd-loan-opt"><input type="radio" name="loanType" value="FHA"> FHA only</label>
              </div>
            </div>
          </div>
          <div class="filter-chip" id="chip-price">
            <span id="chip-price-label">Price</span>
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
            <div class="filter-dropdown" id="dd-price">
              <div class="dd-row">
                <label>Min</label>
                <input id="minPrice" type="number" placeholder="Any" min="0" step="25000" class="dd-input"/>
              </div>
              <div class="dd-row">
                <label>Max</label>
                <input id="maxPrice" type="number" placeholder="Any" min="0" step="25000" class="dd-input"/>
              </div>
            </div>
          </div>
          <div class="filter-chip" id="chip-beds-baths">
            <span id="chip-beds-baths-label">Beds &amp; baths</span>
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
            <div class="filter-dropdown filter-dropdown-bb" id="dd-beds-baths">
              <div class="dd-bb-section">
                <div class="dd-bb-label">Bedrooms</div>
                <div class="dd-bb-row" id="dd-beds-row">
                  <button class="dd-bb-btn active" data-group="beds" data-val="0">Any</button>
                  <button class="dd-bb-btn" data-group="beds" data-val="1">1+</button>
                  <button class="dd-bb-btn" data-group="beds" data-val="2">2+</button>
                  <button class="dd-bb-btn" data-group="beds" data-val="3">3+</button>
                  <button class="dd-bb-btn" data-group="beds" data-val="4">4+</button>
                  <button class="dd-bb-btn" data-group="beds" data-val="5">5+</button>
                </div>
              </div>
              <div class="dd-bb-section">
                <div class="dd-bb-label">Bathrooms</div>
                <div class="dd-bb-row" id="dd-baths-row">
                  <button class="dd-bb-btn active" data-group="baths" data-val="0">Any</button>
                  <button class="dd-bb-btn" data-group="baths" data-val="1">1+</button>
                  <button class="dd-bb-btn" data-group="baths" data-val="1.5">1.5+</button>
                  <button class="dd-bb-btn" data-group="baths" data-val="2">2+</button>
                  <button class="dd-bb-btn" data-group="baths" data-val="3">3+</button>
                  <button class="dd-bb-btn" data-group="baths" data-val="4">4+</button>
                </div>
              </div>
              <div class="dd-bb-apply">
                <button class="dd-bb-apply-btn" id="dd-bb-apply">Apply</button>
              </div>
            </div>
          </div>
        </div>
        <div class="filter-bar-right">
          <span class="count" id="resultCount"></span>
        </div>
      </header>

      <main class="layout">
        <!-- Map panel (left) -->
        <section class="map-wrap">
          <div id="map"></div>
          <!-- Map overlay controls (top-left) -->
          <div class="map-controls-tl">
            <div class="map-pill" id="map-rate-pill">Rate: 2.625 – 4.5%</div>
            <button class="map-pill map-pill-btn" id="map-search-area">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
              Search this area
            </button>
          </div>
          <!-- Zoom controls (bottom-right) -->
          <div class="map-zoom">
            <button class="map-zoom-btn" onclick="if(window.map) map.setZoom(map.getZoom()+1)">+</button>
            <button class="map-zoom-btn" style="border-top:1px solid var(--line)" onclick="if(window.map) map.setZoom(map.getZoom()-1)">−</button>
          </div>
        </section>

        <!-- Right panel: card grid -->
        <div class="right-panel">
          <aside class="sidebar" id="sidebar">
            <div id="card-grid" class="card-grid"></div>
          </aside>
        </div>
      </main>
    </section>
      <!-- Property Detail Modal (v2 — Zillow-style 2-col) -->
      <div id="detailModal" class="dm-scrim" role="dialog" aria-modal="true" aria-labelledby="dmAddress" aria-hidden="true">
        <div class="dm-shell">
          <div class="dm-topbar">
            <div class="dm-topbar-l">
              <button class="dm-back" id="dmBack">← Back to map</button>
              <span class="dm-counter" id="dmCounter" aria-live="polite"></span>
              <div class="dm-pn">
                <button class="dm-pn-btn" id="dmPrev" aria-label="Previous listing">‹</button>
                <button class="dm-pn-btn" id="dmNext" aria-label="Next listing">›</button>
              </div>
            </div>
            <div class="dm-topbar-r">
              <button class="dm-ghost-btn" id="dmShare">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
                Share
              </button>
              <button class="dm-ghost-btn" id="dmSave">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 5.6a5.5 5.5 0 00-7.8 0L12 6.6l-1-1a5.5 5.5 0 00-7.8 7.8L12 22l8.8-8.6a5.5 5.5 0 000-7.8z"/></svg>
                Save
              </button>
              <button class="dm-x-btn" id="dmClose" aria-label="Close">×</button>
            </div>
          </div>
          <div class="dm-body">
            <div class="dm-left" id="dmLeft"></div>
            <div class="dm-right" id="dmRight"></div>
          </div>
        </div>
      </div><!-- #detailModal -->

      <!-- Lead capture modal -->
      <div id="leadModal" class="modal" aria-hidden="true">
        <div class="modal-content">
          <button class="modal-close" id="leadModalClose">✕</button>
          <h3>Contact about this property</h3>
          <div id="leadListingInfo" style="margin-bottom:8px;color:#333;font-size:14px;"></div>
          <form id="leadForm">
            <label>Name<div><input name="name" required /></div></label>
            <label>Email<div><input name="email" type="email" required /></div></label>
            <label>Phone<div><input name="phone" /></div></label>
            <label>Message<div><textarea name="message" rows="3" placeholder="Optional message"></textarea></div></label>
            <input type="hidden" name="listingId" />
            <div style="margin-top:12px;display:flex;gap:8px;">
              <button class="btn btn-primary" type="submit">Send</button>
              <button class="btn btn-outline" type="button" id="leadCancel">Cancel</button>
            </div>
          </form>
          <div id="leadSuccess" style="display:none;margin-top:10px;color:green;">Thanks — lead saved locally. We'll send it to your CRM later.</div>
        </div>
      </div>

      <script src="app.js"></script>
      <script async
        src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBYpbHXJvLttOcuypZewzIjyMko-9uSkVU&v=weekly&libraries=marker&loading=async&callback=initMap"></script>
  </body>
</html>
